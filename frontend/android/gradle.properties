org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Cho phép đường dẫn chứa ký tự tiếng Việt (Windows)
android.overridePathCheck=true
# Tắt Kotlin incremental compilation (tránh lỗi "Could not close incremental caches" trên Windows)
kotlin.compiler.incremental=false
org.gradle.caching=false
# Giảm số worker để tránh race condition khóa file cache trên Windows
org.gradle.workers.max=1
