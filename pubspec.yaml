name: dating_app
description: "Ứng dụng hẹn hò - Litmatch-like (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  dio: ^5.11.1
  socket_io_client: ^3.1.6
  connectivity_plus: ^7.3.1
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  flutter_webrtc: ^1.6.2+hotfix.3
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  just_audio: ^0.10.6
  cached_network_image: ^4.0.0
  flutter_svg: ^2.3.0
  lottie: ^3.6.1
  shimmer: ^4.0.0
  pull_to_refresh: ^2.0.0
  loading_animation_widget: ^1.3.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
